services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: builder # We use the builder stage because it has Drizzle installed!
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "drizzle-kit", "push", "--force"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: builder
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    command: ["npm", "run", "dev"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  kgs_worker:
    build:
      context: .
      dockerfile: Dockerfile.kgs
      target: builder
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    command: ["npm", "run", "dev:kgs_worker"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy 
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analytics_worker:
    build:
      context: .
      dockerfile: Dockerfile.analytics
      target: builder
    env_file:
      - .env
    volumes: 
      - ./src:/app/src
    command: ["npm", "run", "dev:analytics_worker"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  rmqdata:
