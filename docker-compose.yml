services:
  postgres:
      image: bitnami/postgresql:latest
      ports:
        - "5433:5432"
      environment:
        - POSTGRESQL_USERNAME=${DB_USER}
        - POSTGRESQL_PASSWORD=${DB_PASSWORD}
        - POSTGRESQL_DATABASE=${DB_NAME}
        - POSTGRESQL_REPLICATION_MODE=master
        - POSTGRESQL_REPLICATION_USER=repl_user
        - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      volumes:
        - postgres_primary_data:/bitnami/postgresql
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
        interval: 5s
        timeout: 5s
        retries: 5
  postgres-replica:
    image: bitnami/postgresql:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRESQL_USERNAME=${DB_USER}
      - POSTGRESQL_PASSWORD=${DB_PASSWORD}
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_MODE_MASTER_HOST=postgres
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
    volumes:
      - postgres_replica_data:/bitnami/postgresql

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: always
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 5
      AUTH_TYPE: scram-sha-256 
    ports:
      - "6432:5432" 
    depends_on:
      - postgres
  pgadmin:
    image: dpage/pgadmin4
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: builder # We use the builder stage because it has Drizzle installed!
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "drizzle-kit", "push", "--force"]

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
   
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: builder
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    command: ["npm", "run", "dev"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 3

  kgs_worker:
    build:
      context: .
      dockerfile: Dockerfile.kgs
      target: builder
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    command: ["npm", "run", "dev:kgs_worker"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy 
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analytics_worker:
    build:
      context: .
      dockerfile: Dockerfile.analytics
      target: builder
    env_file:
      - .env
    volumes: 
      - ./src:/app/src
    command: ["npm", "run", "dev:analytics_worker"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


volumes:
  postgres_primary_data:
  postgres_replica_data:
  redisdata:
  rmqdata:
